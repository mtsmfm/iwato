# The initial rule of a provider of profiles/iwato-comfy-cloud.yaml (ADR 0022): attaching
# the provider adds it to the sandbox's policy, every endpoint bound to the
# provider (credential_binding), and detaching removes the endpoints bound
# to it. The format is a network preset's (presets.go) with the parameter
# provider, the provider's name.
id: iwato-comfy-cloud
label: Comfy Cloud
params:
  - { name: provider, label: provider, pattern: "[a-z][a-z0-9-]*" }
network_policies:
  provider_${provider}:
    binaries: ["/**"]
    endpoints:
      - { host: cloud.comfy.org, port: 443, path: /api/**, protocol: rest, access: read-write, enforcement: enforce }
      # Partner Nodes: the key again in extra_data.api_key_comfy_org.
      - host: cloud.comfy.org
        port: 443
        path: /api/prompt
        protocol: rest
        enforcement: enforce
        request_body_credential_rewrite: true
        rules:
          - allow: { method: POST, path: /api/prompt }
      # Progress: wss://cloud.comfy.org/ws?clientId=...&token=KEY.
      - { host: cloud.comfy.org, port: 443, path: /ws, protocol: websocket, access: read-only, enforcement: enforce }
      - { host: api.comfy.org, port: 443, path: "/**", protocol: rest, access: read-write, enforcement: enforce }
