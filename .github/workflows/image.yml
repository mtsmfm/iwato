# Iwato's gateway and sandbox images for amd64 and arm64 (the sandbox image
# carries Iwato's daemon cmd/iwato-entrypoint of the same commit). Each image
# is tagged `src-<hash of its sources>` (scripts/image-sources.sh NAME) and
# built only when that tag is not in ghcr.io yet (a run by hand builds both).
# A push to main publishes it and points `edge` and `sha-<commit>` at it, or
# at the existing src- image; the edge exes wait for and pin these (build.yml).
# A pull request only builds, so the Dockerfiles are checked before main.
# Releases publish their own, tagged with the version (release.yml).
# Each image and architecture builds natively on its own runner (no QEMU)
# with a BuildKit cache per image and architecture, pushes by digest, and
# the merge job puts the two architectures under the tags.
name: image
on:
  push:
    branches: [main]
    paths: ["sandboximage/**", "cmd/iwato-entrypoint/**", "internal/termd/**", "internal/rootsftp/**", "internal/openshell/gateway/**", "internal/openshell/wslc/driver.go", "go.mod", "go.sum", "scripts/build-entrypoint.sh", "scripts/image-sources.sh", ".github/workflows/image.yml"]
  pull_request:
    paths: ["sandboximage/**", "cmd/iwato-entrypoint/**", "internal/termd/**", "internal/rootsftp/**", "internal/openshell/gateway/**", "internal/openshell/wslc/driver.go", "go.mod", "go.sum", "scripts/build-entrypoint.sh", "scripts/image-sources.sh", ".github/workflows/image.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # A pull request (and a run by hand on another branch) builds without
  # publishing.
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: plan
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          build=""
          for name in iwato-gateway iwato-sandbox; do
            ref=$REGISTRY/$name:src-$(scripts/image-sources.sh "${name#iwato-}")
            if [ "$FORCE" != true ] && docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
              echo "$ref exists, not building it"
            else
              build="$build${build:+,}\"$name\""
            fi
          done
          echo "build=[$build]" >> "$GITHUB_OUTPUT"
  images:
    needs: plan
    if: needs.plan.outputs.build != '[]'
    strategy:
      matrix:
        name: ${{ fromJSON(needs.plan.outputs.build) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: openshell
        run: echo "version=$(sed -n 's/^\s*OpenShellVersion\s*= "\(.*\)"$/\1/p' internal/openshell/wslc/driver.go)" >> "$GITHUB_OUTPUT"
      - if: matrix.name == 'iwato-sandbox'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - if: matrix.name == 'iwato-sandbox'
        run: scripts/build-entrypoint.sh
        env:
          ARCHES: ${{ matrix.arch }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.name == 'iwato-gateway' && 'internal/openshell/gateway' || 'sandboximage' }}
          target: ${{ matrix.name == 'iwato-gateway' && 'gateway' || '' }}
          build-args: OPENSHELL_TAG=v${{ steps.openshell.outputs.version }}
          platforms: linux/${{ matrix.arch }}
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.arch }}
      - if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
  merge:
    needs: [plan, images]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.images.result == 'success' || needs.images.result == 'skipped') && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    strategy:
      matrix:
        name: [iwato-gateway, iwato-sandbox]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      BUILT: ${{ contains(fromJSON(needs.plan.outputs.build), matrix.name) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.BUILT == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          NAME: ${{ matrix.name }}
        run: |
          src=$(scripts/image-sources.sh "${NAME#iwato-}")
          set --
          if [ "$BUILT" = true ]; then
            for d in "$RUNNER_TEMP"/digests/*; do set -- "$@" "$IMAGE@sha256:${d##*/}"; done
            [ $# -eq 2 ] || { echo "expected 2 digests, got: $*" >&2; exit 1; }
            set -- -t "$IMAGE:src-$src" "$@"
          else
            set -- "$IMAGE:src-$src"
          fi
          docker buildx imagetools create -t "$IMAGE:edge" -t "$IMAGE:sha-${GITHUB_SHA::7}" "$@"
          docker buildx imagetools inspect "$IMAGE:src-$src"
