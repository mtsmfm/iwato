  preset_research_ruby_doc_org:
    endpoints:
      - { host: "ruby-doc.org", port: 443, protocol: rest, enforcement: enforce, rules: [{ allow: { method: GET, path: "/**" } }, { allow: { method: HEAD, path: "/**" } }] }
    binaries: ["/**"]
  preset_research_docs_github_com:
    endpoints:
      - { host: "docs.github.com", port: 443, protocol: rest, enforcement: enforce, rules: [{ allow: { method: GET, path: "/**" } }, { allow: { method: HEAD, path: "/**" } }] }
    binaries: ["/**"]
  preset_research_man7_org:
    endpoints:
      - { host: "man7.org", port: 443, protocol: rest, enforcement: enforce, rules: [{ allow: { method: GET, path: "/**" } }, { allow: { method: HEAD, path: "/**" } }] }
