# Iwato's OpenRouter profile: OpenRouter's OpenAI-compatible inference API.
# Iwato imports it into the gateway (platform scope) when it prepares
# OpenShell. Lint it with:
#   openshell provider profile lint -f profiles/iwato-openrouter.yaml
#
# Adapted from OpenShell v0.1.4's providers/openrouter.yaml (Apache-2.0):
# the API paths only, and the interpreters of Iwato's sandbox image instead
# of OpenCode's image.
#
# Client binaries:   curl and wget, python3 (the image's, mise's and uv's
#                    interpreters: the openai SDK and scripts run there) and
#                    mise's node (the openai and OpenRouter SDKs). OpenShell
#                    matches the interpreter, not the script, so any Python
#                    or Node program may use the key: a narrower list is not
#                    possible for SDK users. wget is not in the standard image
#                    (it is listed for images that have it). An agent with its
#                    own executable (e.g. OpenCode) needs its path added.
# Credential scope:  OPENROUTER_API_KEY, sent as a bearer authorization header
#                    to openrouter.ai/api only (OpenRouter's documented auth).
# Endpoint access:   openrouter.ai/api/** read-write: inference is POST
#                    (/api/v1/chat/completions, /api/v1/completions, ...),
#                    listings are GET. DELETE (e.g. API key management) takes
#                    a policy proposal.
# Verified:          the env var and header against OpenShell's example and
#                    OpenRouter's documented auth; not run against OpenRouter.

id: iwato-openrouter
display_name: OpenRouter (Iwato)
description: OpenRouter inference API for Iwato's sandbox image
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: OpenRouter API key
    env_vars: [OPENROUTER_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: openrouter.ai
    port: 443
    path: /api/**
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/bin/curl
  - /usr/bin/wget
  - /usr/bin/python3*
  - /home/dev/.local/share/mise/installs/python/*/bin/python3*
  - /home/dev/.local/share/uv/python/*/bin/python3*
  - /home/dev/.local/share/mise/installs/node/*/bin/node
