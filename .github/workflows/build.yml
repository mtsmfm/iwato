# Builds the Windows exes and the macOS binary on every push (and by hand)
# and keeps them as a workflow artifact. Unlike the release workflow the exes pull the
# sandbox image's `edge` tag (image.yml) and build the gateway image, as
# during development (scripts/build-exe.sh without --images).
name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # web/vendor/codemirror.js is committed minified: rebuild it from the
  # pinned packages (scripts/codemirror/package-lock.json, with integrity)
  # and fail unless it is the committed file and the hash in
  # web/vendor/manifest.json.
  codemirror:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: node
        run: echo "version=$(sed -n 's/^node = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - run: scripts/build-codemirror.sh
      - run: |
          want=$(jq -r '.assets["codemirror.js"]' web/vendor/manifest.json)
          got=$(sha256sum web/vendor/codemirror.js | cut -d' ' -f1)
          [ "$got" = "$want" ] || { echo "web/vendor/codemirror.js built from the lock file is $got, web/vendor/manifest.json says $want" >&2; exit 1; }
          git diff --exit-code -- web/vendor/
  # The pinned digests and SHA-256 match their sources (OpenShell's images
  # and release, Selkies' release); ubuntu:24.04's is only reported.
  pins:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-pins.sh
        env:
          GH_TOKEN: ${{ github.token }}
  exes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # setup-go's own cache is keyed on go.sum only, so once saved it is never
      # refreshed and the windows and linux/arm64 builds compile cold. This one
      # is saved under a new key by every push to main and restored from the
      # newest (branches can read main's caches).
      - id: go-env
        run: |
          echo "cache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.cache }}
            ${{ steps.go-env.outputs.modcache }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-${{ runner.os }}-${{ runner.arch }}-
      - run: python3 scripts/fetch-vendor.py
      - run: go test ./...
      # The fake backend of the browser checks and the tests that use it
      # are built only with the tag uitest.
      - run: go vet -tags uitest ./...
      - run: go test -tags uitest ./...
      # The tests on a Mac are macos.yml.
      - run: GOOS=darwin GOARCH=arm64 go vet ./...
      - run: scripts/build-exe.sh
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.cache }}
            ${{ steps.go-env.outputs.modcache }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iwato-windows-${{ github.sha }}
          path: |
            dist/windows-*/iwato.exe
            dist/darwin-arm64/iwato
          if-no-files-found: error
          retention-days: 30
