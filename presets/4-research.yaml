# Iwato's network preset for common references and documentation, read only
# (GET and HEAD) from any program.
# No search engines: their forms post. No hosts that take a credential.
id: research
label: よく読む参照先
note: Wikipedia・arXiv・各言語の文書・Stack Overflow などを読み取りだけで見られます
network_policies:
  # Wikipedia and its images.
  preset_research_en_wikipedia_org:
    endpoints:
      - { host: "en.wikipedia.org", port: 443, protocol: rest, enforcement: enforce, rules: [{ allow: { method: GET, path: "/**" } }, { allow: { method: HEAD, path: "/**" } }] }
    binaries: ["/**"]
  preset_research_ja_wikipedia_org:
    endpoints:
      - { host: "ja.wikipedia.org", port: 443, protocol: rest, enforcement: enforce, rules: [{ allow: { method: GET, path: "/**" } }, { allow: { method: HEAD, path: "/**" } }] }
    binaries: ["/**"]
  preset_research_upload_wikimedia_org:
    endpoints:
      - { host: "upload.wikimedia.org", port: 443, protocol: rest, enforcement: enforce, rules: [{ allow: { method: GET, path: "/**" } }, { allow: { method: HEAD, path: "/**" } }] }
    binaries: ["/**"]
  # arXiv: the site, and export.arxiv.org for its API.
  preset_research_arxiv_org:
    endpoints:
      - { host: "arxiv.org", port: 443, protocol: rest, enforcement: enforce, rules: [{ allow: { method: GET, path: "/**" } }, { allow: { method: HEAD, path: "/**" } }] }
    binaries: ["/**"]
  preset_research_export_arxiv_org:
    endpoints:
      - { host: "export.arxiv.org", port: 443, protocol: rest, enforcement: enforce, rules: [{ allow: { method: GET, path: "/**" } }, { allow: { method: HEAD, path: "/**" } }] }
    binaries: ["/**"]
  # Languages' and tools' documentation.
  preset_research_developer_mozilla_org:
    endpoints:
      - { host: "developer.mozilla.org", port: 443, protocol: rest, enforcement: enforce, rules: [{ allow: { method: GET, path: "/**" } }, { allow: { method: HEAD, path: "/**" } }] }
    binaries: ["/**"]
  preset_research_docs_python_org:
    endpoints:
      - { host: "docs.python.org", port: 443, protocol: rest, enforcement: enforce, rules: [{ allow: { method: GET, path: "/**" } }, { allow: { method: HEAD, path: "/**" } }] }
    binaries: ["/**"]
  preset_research_go_dev:
    endpoints:
      - { host: "go.dev", port: 443, protocol: rest, enforcement: enforce, rules: [{ allow: { method: GET, path: "/**" } }, { allow: { method: HEAD, path: "/**" } }] }
    binaries: ["/**"]
  preset_research_pkg_go_dev:
    endpoints:
      - { host: "pkg.go.dev", port: 443, protocol: rest, enforcement: enforce, rules: [{ allow: { method: GET, path: "/**" } }, { allow: { method: HEAD, path: "/**" } }] }
    binaries: ["/**"]
  preset_research_doc_rust_lang_org:
    endpoints:
      - { host: "doc.rust-lang.org", port: 443, protocol: rest, enforcement: enforce, rules: [{ allow: { method: GET, path: "/**" } }, { allow: { method: HEAD, path: "/**" } }] }
    binaries: ["/**"]
  preset_research_docs_rs:
    endpoints:
      - { host: "docs.rs", port: 443, protocol: rest, enforcement: enforce, rules: [{ allow: { method: GET, path: "/**" } }, { allow: { method: HEAD, path: "/**" } }] }
    binaries: ["/**"]
  # Shared with tools under one name (see storage.googleapis.com in packages).
  preset_nodejs_org:
    endpoints:
      - { host: "nodejs.org", port: 443, protocol: rest, enforcement: enforce, rules: [{ allow: { method: GET, path: "/**" } }, { allow: { method: HEAD, path: "/**" } }] }
    binaries: ["/**"]
  preset_research_docs_ruby_lang_org:
