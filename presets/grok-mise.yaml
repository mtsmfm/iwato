# Iwato's network preset: Grok Build with mise. mise's registry installs
# grok with its http backend: the version from x.ai/cli/stable, the binary
# from xAI's bucket. grok installed this way counts itself as installed by
# xAI's installer, so its updater checks and downloads new versions from
# x.ai/cli (storage.googleapis.com as the fallback) into
# ~/.grok/downloads (grok-VERSION-linux-ARCH, with .zst/.gz variants).
id: grok-mise
label: Grok Build を mise で入れる
note: mise use -g grok の版の確認とダウンロード、grok 自身の更新 (x.ai の /cli/、storage.googleapis.com の grok-build-public-artifacts/cli)。認証情報は付かない宛先だけ。api.x.ai は grok のプロバイダーで通す
network_policies:
  allow_x_ai_443:
    endpoints:
      - host: x.ai
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/cli/**" }
          - allow: { method: HEAD, path: "/cli/**" }
    binaries:
      - /usr/local/lib/mise/mise
      - /home/dev/.local/share/mise/installs/grok/*/grok
      - /home/dev/.grok/downloads/grok-*
  allow_storage_googleapis_com_443:
    endpoints:
      - host: storage.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/grok-build-public-artifacts/cli/**" }
          - allow: { method: HEAD, path: "/grok-build-public-artifacts/cli/**" }
    binaries:
      - /usr/local/lib/mise/mise
      - /home/dev/.local/share/mise/installs/grok/*/grok
      - /home/dev/.grok/downloads/grok-*
