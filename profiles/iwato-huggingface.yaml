# Iwato's Hugging Face profile: the Hub (models, datasets, spaces) for
# downloads. Iwato imports it into the gateway (platform scope) when it
# prepares OpenShell. Lint it with:
#   openshell provider profile lint -f profiles/iwato-huggingface.yaml
#
# Client binaries:   python3 (the image's, mise's and uv's interpreters:
#                    huggingface_hub, the `hf` / `huggingface-cli` scripts,
#                    transformers, diffusers and hf_xet all run in the
#                    interpreter), mise's node (huggingface.js,
#                    transformers.js), curl and wget, and git with its HTTPS
#                    helper. Rules allow every program (ADR 0022).
# Credential scope:  HF_TOKEN, and HUGGING_FACE_HUB_TOKEN (the older name
#                    huggingface_hub still reads: utils/_auth.py), sent as a
#                    bearer authorization header (git: the Basic password) to
#                    huggingface.co and hf.co only: the hosts huggingface_hub
#                    forwards the token to (constants.py HF_URL_HOSTS).
# Endpoint access:   reads: GET and HEAD, plus the POSTs that only read:
#                    paths-info (snapshot_download, hf_hub_download), the
#                    git-lfs batch API and git-upload-pack (clone, fetch).
#                    Uploads, commits, repo creation and Inference Providers
#                    (router.huggingface.co, not listed) take a policy
#                    proposal (approving one can attach the provider's credential:
#                    ADR 0022); the token reaches only the hosts above.
# Downloads:         /resolve/ answers with a redirect to a signed URL on
#                    cdn-lfs*.huggingface.co, cas-bridge.xethub.hf.co or other
#                    *.hf.co hosts (Xet storage: cas-server.xethub.hf.co with
#                    the short-lived token the Hub returns). huggingface_hub
#                    drops the authorization header there (file_download.py:
#                    "Remove authorization header when downloading a LFS blob
#                    from a CDN"), so they need no credential and are not in
#                    iwato/credential-hosts. Approve them as ordinary rules
#                    (read-only) when proposed.
# Verified:          from huggingface_hub's source (main, via GitHub).
#                    The redirect hosts above are from the source, not
#                    observed.
# Endpoints:         none (ADR 0022): the credential goes only to the sandbox
#                    policy's endpoints bound to the provider
#                    (credential_binding). Attaching adds presets/providers/
#                    iwato-huggingface.yaml; iwato/credential-hosts names the
#                    hosts the credential is meant for.

id: iwato-huggingface
display_name: Hugging Face (Iwato)
description: Hugging Face Hub downloads for Iwato's sandbox image
category: data
annotations:
  iwato/credential-hosts: "huggingface.co:443,hf.co:443"
credentials:
  - name: token
    description: Hugging Face user access token
    env_vars: [HF_TOKEN, HUGGING_FACE_HUB_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [token]
binaries:
  - /usr/bin/curl
  - /usr/bin/wget
  - /usr/bin/python3*
  - /home/dev/.local/share/mise/installs/python/*/bin/python3*
  - /home/dev/.local/share/uv/python/*/bin/python3*
  - /home/dev/.local/share/mise/installs/node/*/bin/node
  - /usr/bin/git
  - /usr/lib/git-core/git-remote-http
  - /usr/lib/git-core/git-remote-https
