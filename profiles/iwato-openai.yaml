# Iwato's OpenAI API profile: an API key for api.openai.com (the OpenAI
# SDKs, Codex with an API key). Iwato imports it into the gateway (platform
# scope) when it prepares OpenShell. Lint it with:
#   openshell provider profile lint -f profiles/iwato-openai.yaml
#
# Client binaries:   curl and wget, the image's, mise's and uv's python3,
#                    mise's node and codex.
# Credential scope:  OPENAI_API_KEY, sent as a bearer authorization header
#                    to api.openai.com/v1 only.
# Endpoint access:   api.openai.com/v1/** read-write: inference is POST.
# Verified:          the env var and header against OpenAI's documented auth;
#                    not run against OpenAI.
# Endpoints:         none (ADR 0022): the credential goes only to the sandbox
#                    policy's endpoints bound to the provider
#                    (credential_binding). Attaching adds presets/providers/
#                    iwato-openai.yaml; iwato/credential-hosts names the hosts
#                    the credential is meant for.

id: iwato-openai
display_name: OpenAI API (Iwato)
description: OpenAI API key for Iwato's sandbox image
category: inference
annotations:
  iwato/credential-hosts: "api.openai.com:443"
inference_capable: true
credentials:
  - name: api_key
    description: OpenAI API key
    env_vars: [OPENAI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
binaries:
  - /usr/bin/curl
  - /usr/bin/wget
  - /usr/bin/python3*
  - /home/dev/.local/share/mise/installs/python/*/bin/python3*
  - /home/dev/.local/share/uv/python/*/bin/python3*
  - /home/dev/.local/share/mise/installs/node/*/bin/node
  - /home/dev/.local/share/mise/installs/codex/*/bin/codex
