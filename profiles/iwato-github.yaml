# Iwato's GitHub provider profile. Iwato imports it into the gateway
# (platform scope) when it prepares OpenShell. Lint it with:
#   openshell provider profile lint -f profiles/iwato-github.yaml
#
# Adapted from OpenShell v0.1.4's providers/github.yaml (Apache-2.0): the
# paths of Iwato's sandbox image (sandboximage/), and uploads.github.com,
# so that a proposal that allows uploading release assets gets the token
# too.
#
# Client binaries:   gh, git (git runs git-remote-https for HTTPS remotes).
# Reference layout:  Ubuntu's git and gh packages under /usr.
# Credential scope:  GITHUB_TOKEN and GH_TOKEN, sent as a bearer
#                    authorization header to the bound endpoints only.
# Endpoint access:   the API read-only; github.com clone and fetch only.
#                    Writes and push (git-receive-pack) take a policy
#                    proposal; approving one can attach the provider's credential
#                    (ADR 0022).
# Endpoints:         none (ADR 0022): the credential goes only to the sandbox
#                    policy's endpoints bound to the provider
#                    (credential_binding). Attaching adds presets/providers/
#                    iwato-github.yaml; iwato/credential-hosts names the
#                    hosts the credential is meant for.

id: iwato-github
display_name: GitHub (Iwato)
description: GitHub API and Git over HTTPS for Iwato's sandbox image
category: source_control
annotations:
  iwato/credential-hosts: "api.github.com:443,github.com:443,uploads.github.com:443"
credentials:
  - name: token
    description: GitHub token
    env_vars: [GITHUB_TOKEN, GH_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
binaries:
  - /usr/bin/gh
  - /usr/bin/git
  - /usr/lib/git-core/git-remote-http
  - /usr/lib/git-core/git-remote-https
