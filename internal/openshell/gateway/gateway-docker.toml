# The gateway with OpenShell's own Docker compute driver (macOS and Linux,
# docs/adr/0002): it runs in the gateway, on the engine's API socket that
# Iwato mounts at /var/run/docker.sock. The entrypoint writes the sandbox
# label (SANDBOX_LABEL, Iwato's namespace) into a copy of this file.
[openshell]
version = 2

[openshell.gateway]
name           = "iwato"
bind_address   = "0.0.0.0:17670"
log_level      = "info"
compute_driver = "docker"
# The CA the supervisors trust for https://127.0.0.1:17670 (the gateway
# gives it to the driver).
guest_tls_ca   = "/var/lib/openshell/tls/ca.crt"

[openshell.gateway.gateway_jwt]
signing_key_path = "/var/lib/openshell/tls/jwt/signing.pem"
public_key_path  = "/var/lib/openshell/tls/jwt/public.pem"
kid_path         = "/var/lib/openshell/tls/jwt/kid"
gateway_id       = "iwato"

# As gateway.toml: the key lives in the state volume.
[openshell.gateway.credential_storage]
key_encryption_key_path = "/var/lib/openshell/credentials/key-encryption-key.bin"

# Supervisors use the engine's host network and reach the gateway's
# published port on 127.0.0.1. AppArmor is unconfined: upstream says the
# supervisor needs mounts the default profile denies.
[openshell.drivers.docker]
socket_path         = "/var/run/docker.sock"
allow_driver_config = true
grpc_endpoint       = "https://127.0.0.1:17670"
image_pull_policy   = "if_not_present"
sandbox_label       = "SANDBOX_LABEL"
app_armor_profile   = "Unconfined"
# The official runtime images, pinned by digest: the same as the WSLc
# driver's (DefaultSupervisorImage and DefaultSandboxImage in
# internal/openshell/wslc/driver.go; TestDockerfilePinsOpenShell).
supervisor_image      = "ghcr.io/nvidia/openshell/supervisor:0.1.6@sha256:ce859a7d77ee515d3fe0b3c7dc61286516f402eb1d25c761d806d9ae5ed96c0b"
sandbox_runtime_image = "ghcr.io/nvidia/openshell/sandbox:0.1.6@sha256:1038eb5c1f191fa3c34684fd7041b891c78ec570979d487f36e06e08f91bfb63"
