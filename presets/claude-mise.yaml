# Iwato's network preset: Claude Code installed with mise. The format is
# described in presets.go (network_policies as in OpenShell's policy YAML).
id: claude-mise
label: Claude Code を mise で入れる
note: mise のダウンロード (GitHub、mise-versions.jdx.dev) と、Claude Code の更新・設定の取得 (downloads.claude.ai、platform.claude.com、raw.githubusercontent.com)。認証情報は付かない宛先だけ。api.anthropic.com は claude のプロバイダーで通す
network_policies:
  allow_api_github_com_443:
    endpoints:
      - { host: api.github.com, port: 443, protocol: rest, enforcement: enforce, access: read-only }
    binaries: [/usr/local/lib/mise/mise]
  allow_github_com_443:
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "**" }
          - allow: { method: HEAD, path: "**" }
          - allow: { method: OPTIONS, path: "**" }
    binaries: [/usr/local/lib/mise/mise]
  allow_release_assets_githubusercontent_com_443:
    endpoints:
      - { host: release-assets.githubusercontent.com, port: 443, protocol: rest, enforcement: enforce, access: read-only }
    binaries: [/usr/local/lib/mise/mise]
  allow_mise_versions_jdx_dev_443:
    endpoints:
      - host: mise-versions.jdx.dev
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "**" }
          - allow: { method: HEAD, path: "**" }
          - allow: { method: OPTIONS, path: "**" }
          - allow: { method: POST, path: /api/tools/claude }
    binaries: [/usr/local/lib/mise/mise]
  allow_downloads_claude_ai_443:
    endpoints:
      - host: downloads.claude.ai
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/claude-code-releases/**" }
    binaries:
      - /home/dev/.local/share/claude/versions/*
      - /home/dev/.local/share/mise/installs/claude/*/claude
  allow_platform_claude_com_443:
    endpoints:
      - { host: platform.claude.com, port: 443, protocol: rest, enforcement: enforce, access: read-only }
    binaries:
      - /home/dev/.local/share/claude/versions/*
      - /home/dev/.local/share/mise/installs/claude/*/claude
  allow_raw_githubusercontent_com_443:
    endpoints:
      - { host: raw.githubusercontent.com, port: 443, protocol: rest, enforcement: enforce, access: read-only }
    binaries:
      - /home/dev/.local/share/claude/versions/*
      - /home/dev/.local/share/mise/installs/claude/*/claude
