# Iwato's Vast.ai profile: the console API the `vastai` CLI and SDK use
# (GPU offers, instances, templates). Iwato imports it into the gateway
# (platform scope) when it prepares OpenShell. Lint it with:
#   openshell provider profile lint -f profiles/iwato-vastai.yaml
#
# Client binaries:   python3 (the image's, mise's and uv's interpreters:
#                    `vastai` and vastai-sdk are Python), curl and wget. Any
#                    Python program may use the key: OpenShell matches the
#                    interpreter, not the script. wget is not in the standard
#                    image (it is listed for images that have it).
# Credential scope:  VAST_API_KEY (vast.py: the default of --api-key; the CLI
#                    otherwise reads ~/.config/vastai/vast_api_key), sent as a
#                    bearer authorization header (vast.py apiheaders) to
#                    console.vast.ai/api only (vast.py server_url_default).
#                    Older clients send `?api_key=`: OpenShell resolves the
#                    placeholder there too.
# Endpoint access:   reads, and the two searches that are not GETs: PUT
#                    /api/v0/search/asks/ and POST /api/v0/bundles/ (`vastai
#                    search offers`). Renting, changing and destroying
#                    instances spend money or lose data, so they take a policy
#                    proposal (approving one can attach the provider's credential:
#                    ADR 0022). A key with
#                    restricted permissions (`vastai create api-key
#                    --permission_file`) narrows it further.
#                    cloud.vast.ai (the web console) and run.vast.ai (serverless,
#                    which takes the key in a JSON body) are not listed.
# Verified:          from vast-ai/vast-cli's vast.py (master, via GitHub).
# Endpoints:         none (ADR 0022): the credential goes only to the sandbox
#                    policy's endpoints bound to the provider
#                    (credential_binding). Attaching adds presets/providers/
#                    iwato-vastai.yaml; iwato/credential-hosts names the
#                    hosts the credential is meant for.

id: iwato-vastai
display_name: Vast.ai (Iwato)
description: Vast.ai console API for Iwato's sandbox image
category: other
annotations:
  iwato/credential-hosts: "console.vast.ai:443"
credentials:
  - name: api_key
    description: Vast.ai API key
    env_vars: [VAST_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
binaries:
  - /usr/bin/curl
  - /usr/bin/wget
  - /usr/bin/python3*
  - /home/dev/.local/share/mise/installs/python/*/bin/python3*
  - /home/dev/.local/share/uv/python/*/bin/python3*
