# Tests on a Mac, only when darwin-related files change (macOS minutes
# cost more; build.yml vets the darwin build on every push).
name: macos
on:
  push:
    paths:
      - "**_darwin.go"
      - "**_darwin_test.go"
      - "internal/protect/**"
      - "internal/dockercli/**"
      - "internal/openshell/gateway/**"
      - "engine*.go"
      - "checks*.go"
      - "config.go"
      - "main.go"
      - ".github/workflows/macos.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: python3 scripts/fetch-vendor.py
      - run: go vet ./...
      - run: go test ./...
      - run: go test -tags uitest .
