# Iwato's RunPod profile: the control plane `runpodctl` and the `runpod`
# Python SDK use (account, GPU types, pods, serverless endpoints), and the
# serverless invoke API. Iwato imports it into the gateway (platform scope)
# when it prepares OpenShell. Lint it with:
#   openshell provider profile lint -f profiles/iwato-runpod.yaml
#
# Client binaries:   runpodctl (Go: `mise use -g github:runpod/runpodctl`
#                    installs it under mise's installs/github-runpod-runpodctl;
#                    RunPod's install script puts it in /usr/local/bin, which
#                    needs root, so that path is for images that have it),
#                    python3 (the image's, mise's and uv's interpreters: the
#                    `runpod` SDK and its `runpod`/`rp` CLI are Python), mise's
#                    node (runpod-sdk, serverless only), curl and wget. Any
#                    Python or Node program may use the key: OpenShell matches
#                    the interpreter, not the script. wget is not in the
#                    standard image (it is listed for images that have it).
#                    `runpodctl update` replaces the executable in place, which
#                    OpenShell's binary pinning refuses until the sandbox
#                    restarts: update it with mise instead.
# Credential scope:  RUNPOD_API_KEY (runpodctl internal/configenv APIKeyEnv,
#                    otherwise ~/.runpod/config.toml; runpod-python
#                    runpod/__init__.py _load_api_key, otherwise
#                    ~/.runpod/config.toml), sent as a bearer authorization
#                    header by both to:
#                    - api.runpod.io/graphql (runpodctl api/query.go and
#                      internal/api/graphql.go DefaultGraphQLURL; runpod-python
#                      api/graphql.py),
#                    - api.runpod.io/v2 (REST v2: runpod-python api/rest.py;
#                      runpodctl internal/api/logs.go DefaultRESTV2BaseURL for
#                      logs and workers),
#                    - rest.runpod.io/v1 (REST v1: runpodctl
#                      internal/api/client.go DefaultBaseURL, its CRUD),
#                    - api.runpod.ai/v2 (serverless invoke: runpodctl
#                      internal/api/endpoints.go ServerlessInvokeBaseURL,
#                      runpod-python endpoint_url_base, runpod-sdk),
#                    - hapi.runpod.net/v1 (pod logs: runpod-python apps/logs.py
#                      HAPI_BASE).
#                    RUNPOD_AI_API_KEY (runpod-python http_client.py,
#                    serverless/modules/rp_ping.py) is the key a worker gets
#                    inside RunPod, not set here.
# Endpoint access:   reads only. GraphQL: queries (myself, gpuTypes, pods);
#                    mutations (podFindAndDeployOnDemand, podResume, saveEndpoint
#                    ...) take a policy proposal. REST: GET, HEAD and OPTIONS;
#                    creating, starting, stopping and deleting pods, endpoints,
#                    templates and volumes (POST, PATCH, PUT, DELETE) take a
#                    policy proposal, and so do serverless runs (POST
#                    /v2/ID/run, /runsync), which cost money. Health and job
#                    status (GET) are allowed. Approving a proposal widens the
#                    provider's scope (ADR 0006, 0014).
#                    Not listed: load-balanced serverless endpoints
#                    (ID.api.runpod.ai, runpod-python apps/targets.py), pods'
#                    proxy (ID-PORT.proxy.runpod.net, which takes the pod's own
#                    token) and the console (console.runpod.io, the browser's).
# Verified:          from runpod/runpodctl (main, e12397351fa1, 2026-10-16),
#                    runpod/runpod-python (main, 4473f30acc31, 2026-10-16) and
#                    runpod/js-sdk (main), via GitHub; runpodctl's mise path by
#                    installing github:runpod/runpodctl 3.0.1.

id: iwato-runpod
display_name: RunPod (Iwato)
description: RunPod API (GraphQL, REST and serverless) for Iwato's sandbox image
category: other
credentials:
  - name: api_key
    description: RunPod API key
    env_vars: [RUNPOD_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: api.runpod.io
    port: 443
    path: /graphql
    protocol: graphql
    access: read-only
    enforcement: enforce
  - host: api.runpod.io
    port: 443
    path: /v2/**
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: rest.runpod.io
    port: 443
    path: /v1/**
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: api.runpod.ai
    port: 443
    path: /v2/**
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: hapi.runpod.net
    port: 443
    path: /v1/**
    protocol: rest
    access: read-only
    enforcement: enforce
binaries:
  - /home/dev/.local/share/mise/installs/github-runpod-runpodctl/*/runpodctl
  - /usr/local/bin/runpodctl
  - /usr/bin/curl
  - /usr/bin/wget
  - /usr/bin/python3*
  - /home/dev/.local/share/mise/installs/python/*/bin/python3*
  - /home/dev/.local/share/uv/python/*/bin/python3*
  - /home/dev/.local/share/mise/installs/node/*/bin/node
