# Builds the Windows exes and the macOS and Linux binaries on every push
# (and by hand) and keeps them as a workflow artifact; on main they also
# replace the pre-release `edge` (the edge jobs). The artifact's exes pull
# the sandbox image's `edge` tag (image.yml) and build the gateway image,
# as during development (scripts/build-exe.sh without --images); the edge
# exes pull both images, pinned by digest.
name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # web/vendor/codemirror.js and markdown.js are committed minified: rebuild
  # them from the pinned packages (scripts/codemirror/package-lock.json, with
  # integrity) and fail unless they are the committed files and the hashes in
  # web/vendor/manifest.json.
  codemirror:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: node
        run: echo "version=$(sed -n 's/^node = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - run: scripts/build-codemirror.sh
      - run: |
          for f in codemirror.js markdown.js; do
            want=$(jq -r --arg f "$f" '.assets[$f]' web/vendor/manifest.json)
            got=$(sha256sum "web/vendor/$f" | cut -d' ' -f1)
            [ "$got" = "$want" ] || { echo "web/vendor/$f built from the lock file is $got, web/vendor/manifest.json says $want" >&2; exit 1; }
          done
          git diff --exit-code -- web/vendor/
  # The pinned digests and SHA-256 match their sources (OpenShell's images
  # and release, Selkies' release); ubuntu:24.04's is only reported.
  pins:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-pins.sh
        env:
          GH_TOKEN: ${{ github.token }}
  exes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # setup-go's own cache is keyed on go.sum only, so once saved it is never
      # refreshed and the windows and linux/arm64 builds compile cold. This one
      # is saved under a new key by every push to main and restored from the
      # newest (branches can read main's caches).
      - id: go-env
        run: |
          echo "cache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.cache }}
            ${{ steps.go-env.outputs.modcache }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-${{ runner.os }}-${{ runner.arch }}-
      - run: python3 scripts/fetch-vendor.py
      - run: go test ./...
      # The fake backend of the browser checks and the tests that use it
      # are built only with the tag uitest.
      - run: go vet -tags uitest ./...
      - run: go test -tags uitest ./...
      # The tests on a Mac are macos.yml.
      - run: GOOS=darwin GOARCH=arm64 go vet ./...
      - run: scripts/build-exe.sh
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.cache }}
            ${{ steps.go-env.outputs.modcache }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iwato-windows-${{ github.sha }}
          path: |
            dist/windows-*/iwato.exe
            dist/darwin-arm64/iwato
            dist/linux-*/iwato
          if-no-files-found: error
          retention-days: 30
  # The edge exes pull both images of their own sources by digest
  # (scripts/build-exe.sh --images --image-tag edge --image-digests).
  # image.yml publishes each in parallel on the same push, or did on an
  # earlier push with the same sources, tagged src-<hash of its sources>
  # (scripts/image-sources.sh NAME): this job waits for that tag, so it
  # never pins an older image. A newer push cancels the wait.
  edge-exes:
    if: github.ref == 'refs/heads/main'
    needs: [codemirror, pins, exes]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    concurrency:
      group: edge-exes
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-env
        run: |
          echo "cache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.cache }}
            ${{ steps.go-env.outputs.modcache }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-${{ runner.os }}-${{ runner.arch }}-
      - run: python3 scripts/fetch-vendor.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          digests=""
          for name in iwato-gateway iwato-sandbox; do
            ref=$REGISTRY/$name:src-$(scripts/image-sources.sh "${name#iwato-}")
            until d=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>/dev/null | jq -r .digest); echo "$d" | grep -Eqx 'sha256:[0-9a-f]{64}'; do
              echo "waiting for $ref (image.yml)"
              sleep 60
            done
            digests="$digests${digests:+,}$name=$d"
          done
          echo "pinning $digests"
          scripts/build-exe.sh --images "$REGISTRY" --image-tag edge --image-digests "$digests" --channel edge --repo "$GITHUB_REPOSITORY"
          scripts/build-meta.sh edge "$digests"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iwato-edge-${{ github.sha }}
          path: |
            dist/windows-*/iwato.exe
            dist/darwin-arm64/iwato
            dist/linux-*/iwato
            dist/iwato-build.json
          if-no-files-found: error
          retention-days: 1
  # Every push to main replaces the exes and the macOS and Linux binaries
  # of the pre-release `edge` (the tag follows main), and iwato-build.json,
  # which the exes check for updates (update.go).
  edge:
    needs: edge-exes
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: edge-release
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iwato-edge-${{ github.sha }}
          path: dist
      - name: Publish the edge pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          for a in amd64 arm64; do cp dist/windows-$a/iwato.exe iwato-windows-$a.exe; done
          cp dist/darwin-arm64/iwato iwato-darwin-arm64
          for a in amd64 arm64; do cp dist/linux-$a/iwato iwato-linux-$a; done
          if gh api "repos/$GH_REPO/git/refs/tags/edge" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/edge" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/edge -f sha="$GITHUB_SHA" >/dev/null
          fi
          notes="Unstable build of main at $GITHUB_SHA ($(date -u +%Y-%m-%dT%H:%MZ)). Replaced on every push to main; expect breaking changes."
          if gh release view edge >/dev/null 2>&1; then
            gh release edit edge --prerelease --title "Edge (main)" --notes "$notes"
          else
            gh release create edge --prerelease --title "Edge (main)" --notes "$notes"
          fi
          gh release upload edge iwato-windows-amd64.exe iwato-windows-arm64.exe iwato-darwin-arm64 iwato-linux-amd64 iwato-linux-arm64 --clobber
          # Last: until it is replaced, the old metadata's hashes refuse the new binaries.
          gh release upload edge dist/iwato-build.json --clobber
