# Iwato's Atlassian MCP profile: Atlassian's remote MCP server (Rovo MCP
# server). Iwato registers itself (dynamic client registration), lets the
# owner authorize it and gives the gateway the refresh token; the gateway
# refreshes the access token (oauth2_refresh_token) and the sandbox gets a
# placeholder. Iwato imports it into the gateway (platform scope) when it
# prepares OpenShell. Lint it with:
#   openshell provider profile lint -f profiles/iwato-atlassian.yaml
#
# Client binaries:   Claude Code, which sends the header itself (Bun's
#                    fetch, no node); the same paths as iwato-claude-subscription.yaml.
# Credential scope:  ATLASSIAN_ACCESS_TOKEN, sent as a bearer authorization
#                    header to the MCP endpoint only.
# Endpoint access:   https://mcp.atlassian.com/v2/mcp and below, inspected
#                    as MCP: the read tools only (presets/providers/
#                    iwato-atlassian.yaml, which says where the list comes
#                    from); write tools take a proposal.
# Refresh:           at auth.atlassian.com, with the grant's scopes (none
#                    named here). Iwato refuses an authorization server
#                    whose token endpoint is not this token_url.
# Endpoints:         none (ADR 0022): the credential goes only to the sandbox
#                    policy's endpoints bound to the provider
#                    (credential_binding). Attaching adds presets/providers/
#                    iwato-atlassian.yaml; iwato/credential-hosts names the
#                    hosts the credential is meant for.

id: iwato-atlassian
display_name: Atlassian MCP (Iwato)
description: Atlassian's remote MCP server with an OAuth grant the gateway refreshes
category: agent
annotations:
  iwato/credential-hosts: "mcp.atlassian.com:443"
credentials:
  - name: access_token
    description: Atlassian MCP OAuth access token
    env_vars: [ATLASSIAN_ACCESS_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
    refresh:
      strategy: oauth2_refresh_token
      token_url: https://auth.atlassian.com/oauth/token
      refresh_before: "300s"
      max_lifetime: "3600s"
      material:
        - name: client_id
          description: OAuth client ID (dynamic client registration, public client)
          required: true
        - name: refresh_token
          description: OAuth refresh token
          required: true
          secret: true
binaries:
  - /home/dev/.local/share/claude/versions/*
  - /home/dev/.local/share/mise/installs/claude/*/claude
