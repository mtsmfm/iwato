# Iwato's network preset: package downloads for any program, read only
# (GET, HEAD and OPTIONS, plus the few POSTs that only read: npm's audit and
# the registries' token requests), and the installs and updates of Claude
# Code and Grok Build for their own programs. Every endpoint is inspected
# (rest, enforce), as the providers' endpoints are, so attaching a provider
# later (GitHub's included) never makes an endpoint ambiguous. HEAD is
# allowed wherever GET is (OpenShell matches a HEAD against GET rules).
# Ubuntu's apt mirrors are left out: the sandbox has no root. github.com and
# api.github.com are left out for other programs (ADR 0006): the GitHub
# provider's token goes to every path there, so what is allowed on them is
# the provider's to say. Downloads from github.com (release assets,
# archives) need that provider, or a proposal, for their first request; the
# redirects they lead to (objects/release-assets.githubusercontent.com,
# codeload.github.com) carry no credential and are here. The exception is
# mise's own read-only rules there (the list marks them).
id: packages
label: パッケージと Claude Code・Grok Build のダウンロード
note: npm・PyPI (uv の Python も)・crates.io・Rust のツールチェーン・Go・RubyGems・mise・Node.js と Go の本体・GitHub のリリース・アーカイブの転送先と raw (github.com と api.github.com そのものは GitHub のプロバイダーの宛先なので、後述の mise の分のほかは含みません)・Docker Hub と ghcr.io のイメージを、どのプログラムからも読み取りだけ (GET・HEAD・OPTIONS。POST は読むだけの npm の audit とレジストリーのトークンだけ) 許可します。公開・アップロードは通りません。mise で入れる Claude Code と Grok Build のインストールと更新も、mise・claude・grok 自身にだけ許可します (mise の GitHub からの読み取りと mise-versions.jdx.dev への版の問い合わせ、downloads.claude.ai、platform.claude.com、x.ai の /cli/、storage.googleapis.com の grok-build-public-artifacts/cli)。api.anthropic.com と api.x.ai はそれぞれのプロバイダーで通します
network_policies:
  # npm install and npm audit send the dependency list by POST to the
  # advisory endpoints; they only read (without them every install warns).
  preset_packages_registry_npmjs_org:
    endpoints:
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "**" }
          - allow: { method: HEAD, path: "**" }
          - allow: { method: OPTIONS, path: "**" }
          - allow: { method: POST, path: /-/npm/v1/security/advisories/bulk }
          - allow: { method: POST, path: /-/npm/v1/security/audits/quick }
          - allow: { method: POST, path: /-/npm/v1/security/audits }
    binaries: ["/**"]
  preset_packages_pypi_org:
    endpoints:
      - { host: pypi.org, port: 443, protocol: rest, enforcement: enforce, access: read-only }
    binaries: ["/**"]
  preset_packages_files_pythonhosted_org:
    endpoints:
      - { host: files.pythonhosted.org, port: 443, protocol: rest, enforcement: enforce, access: read-only }
    binaries: ["/**"]
  # uv python install (and uv's own downloads) try Astral's mirror of the
  # GitHub releases first, then github.com.
  preset_packages_releases_astral_sh:
    endpoints:
      - { host: releases.astral.sh, port: 443, protocol: rest, enforcement: enforce, access: read-only }
    binaries: ["/**"]
  # cargo search and cargo-binstall (mise's cargo backend) read the API;
  # publishing and yanking (PUT, DELETE) do not get through.
  preset_packages_crates_io:
    endpoints:
      - { host: crates.io, port: 443, protocol: rest, enforcement: enforce, access: read-only }
    binaries: ["/**"]
  preset_packages_index_crates_io:
    endpoints:
      - { host: index.crates.io, port: 443, protocol: rest, enforcement: enforce, access: read-only }
    binaries: ["/**"]
  preset_packages_static_crates_io:
    endpoints:
      - { host: static.crates.io, port: 443, protocol: rest, enforcement: enforce, access: read-only }
    binaries: ["/**"]
  # Rust's toolchains (mise's rust, rustup): the installer, then rustup
  # and the toolchains from static.rust-lang.org.
  preset_packages_sh_rustup_rs:
    endpoints:
      - { host: sh.rustup.rs, port: 443, protocol: rest, enforcement: enforce, access: read-only }
    binaries: ["/**"]
  preset_packages_static_rust_lang_org:
    endpoints:
      - { host: static.rust-lang.org, port: 443, protocol: rest, enforcement: enforce, access: read-only }
    binaries: ["/**"]
  preset_packages_proxy_golang_org:
    endpoints:
      - { host: proxy.golang.org, port: 443, protocol: rest, enforcement: enforce, access: read-only }
    binaries: ["/**"]
  preset_packages_sum_golang_org:
    endpoints:
      - { host: sum.golang.org, port: 443, protocol: rest, enforcement: enforce, access: read-only }
    binaries: ["/**"]
  preset_packages_storage_googleapis_com:
    endpoints:
      - host: storage.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/proxy-golang-org-prod/**" }
    binaries: ["/**"]
  preset_packages_rubygems_org:
    endpoints:
      - { host: rubygems.org, port: 443, protocol: rest, enforcement: enforce, access: read-only }
    binaries: ["/**"]
  preset_packages_index_rubygems_org:
    endpoints:
      - { host: index.rubygems.org, port: 443, protocol: rest, enforcement: enforce, access: read-only }
    binaries: ["/**"]
  preset_packages_mise_versions_jdx_dev:
    endpoints:
      - { host: mise-versions.jdx.dev, port: 443, protocol: rest, enforcement: enforce, access: read-only }
    binaries: ["/**"]
  preset_packages_mise_jdx_dev:
    endpoints:
      - { host: mise.jdx.dev, port: 443, protocol: rest, enforcement: enforce, access: read-only }
    binaries: ["/**"]
  preset_packages_nodejs_org:
    endpoints:
      - host: nodejs.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/dist/**" }
    binaries: ["/**"]
  preset_packages_dl_google_com:
    endpoints:
      - host: dl.google.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/go/**" }
    binaries: ["/**"]
  preset_packages_codeload_github_com:
    endpoints:
      - { host: codeload.github.com, port: 443, protocol: rest, enforcement: enforce, access: read-only }
    binaries: ["/**"]
  preset_packages_objects_githubusercontent_com:
    endpoints:
      - { host: objects.githubusercontent.com, port: 443, protocol: rest, enforcement: enforce, access: read-only }
    binaries: ["/**"]
  preset_packages_release_assets_githubusercontent_com:
    endpoints:
      - { host: release-assets.githubusercontent.com, port: 443, protocol: rest, enforcement: enforce, access: read-only }
    binaries: ["/**"]
  preset_packages_raw_githubusercontent_com:
    endpoints:
      - { host: raw.githubusercontent.com, port: 443, protocol: rest, enforcement: enforce, access: read-only }
    binaries: ["/**"]
  preset_packages_registry_1_docker_io:
    endpoints:
      - { host: registry-1.docker.io, port: 443, protocol: rest, enforcement: enforce, access: read-only }
    binaries: ["/**"]
  # Registry tokens: GET without credentials; containerd (nerdctl,
  # BuildKit) asks with credentials by POST and does not fall back to GET
  # when refused. The token only reads here: pushes stay refused.
  preset_packages_auth_docker_io:
    endpoints:
      - host: auth.docker.io
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "**" }
          - allow: { method: HEAD, path: "**" }
          - allow: { method: OPTIONS, path: "**" }
          - allow: { method: POST, path: /token }
    binaries: ["/**"]
  # Docker Hub's blobs redirect to one of these CDNs.
  preset_packages_production_cloudflare_docker_com:
    endpoints:
      - { host: production.cloudflare.docker.com, port: 443, protocol: rest, enforcement: enforce, access: read-only }
    binaries: ["/**"]
  preset_packages_production_cloudfront_docker_com:
    endpoints:
      - { host: production.cloudfront.docker.com, port: 443, protocol: rest, enforcement: enforce, access: read-only }
    binaries: ["/**"]
  preset_packages_docker_images_prod_r2:
    endpoints:
      - { host: docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com, port: 443, protocol: rest, enforcement: enforce, access: read-only }
    binaries: ["/**"]
  # Tokens as on auth.docker.io (POST /token).
  preset_packages_ghcr_io:
    endpoints:
      - host: ghcr.io
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "**" }
          - allow: { method: HEAD, path: "**" }
          - allow: { method: OPTIONS, path: "**" }
          - allow: { method: POST, path: /token }
    binaries: ["/**"]
  preset_packages_pkg_containers_githubusercontent_com:
    endpoints:
      - { host: pkg-containers.githubusercontent.com, port: 443, protocol: rest, enforcement: enforce, access: read-only }
    binaries: ["/**"]
  # mise use -g claude / grok: mise reads GitHub's releases (read only, its
  # own program only), and asks mise-versions for claude's version by POST.
  preset_packages_api_github_com_mise:
    endpoints:
      - { host: api.github.com, port: 443, protocol: rest, enforcement: enforce, access: read-only }
    binaries: [/usr/local/lib/mise/mise]
  preset_packages_github_com_mise:
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "**" }
          - allow: { method: HEAD, path: "**" }
          - allow: { method: OPTIONS, path: "**" }
    binaries: [/usr/local/lib/mise/mise]
  preset_packages_mise_versions_jdx_dev_mise:
    endpoints:
      - host: mise-versions.jdx.dev
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "**" }
          - allow: { method: HEAD, path: "**" }
          - allow: { method: OPTIONS, path: "**" }
          - allow: { method: POST, path: /api/tools/claude }
    binaries: [/usr/local/lib/mise/mise]
  # Claude Code's updates and settings (installed by mise or by its own
  # updater into versions/).
  preset_packages_downloads_claude_ai:
    endpoints:
      - host: downloads.claude.ai
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/claude-code-releases/**" }
    binaries:
      - /home/dev/.local/share/claude/versions/*
      - /home/dev/.local/share/mise/installs/claude/*/claude
  preset_packages_platform_claude_com:
    endpoints:
      - { host: platform.claude.com, port: 443, protocol: rest, enforcement: enforce, access: read-only }
    binaries:
      - /home/dev/.local/share/claude/versions/*
      - /home/dev/.local/share/mise/installs/claude/*/claude
  # mise's registry installs grok with its http backend: the version from
  # x.ai/cli/stable, the binary from xAI's bucket. grok installed this way
  # counts itself as installed by xAI's installer, so its updater checks
  # and downloads new versions from x.ai/cli (storage.googleapis.com as the
  # fallback) into ~/.grok/downloads (grok-VERSION-linux-ARCH, with .zst/.gz
  # variants).
  preset_packages_x_ai:
    endpoints:
      - host: x.ai
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/cli/**" }
          - allow: { method: HEAD, path: "/cli/**" }
    binaries:
      - /usr/local/lib/mise/mise
      - /home/dev/.local/share/mise/installs/grok/*/grok
      - /home/dev/.grok/downloads/grok-*
  preset_packages_storage_googleapis_com_grok:
    endpoints:
      - host: storage.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/grok-build-public-artifacts/cli/**" }
          - allow: { method: HEAD, path: "/grok-build-public-artifacts/cli/**" }
    binaries:
      - /usr/local/lib/mise/mise
      - /home/dev/.local/share/mise/installs/grok/*/grok
      - /home/dev/.grok/downloads/grok-*
