# The initial rule of a provider of profiles/iwato-cloudflare.yaml (ADR 0022): attaching
# the provider adds it to the sandbox's policy, every endpoint bound to the
# provider (credential_binding), and detaching removes the endpoints bound
# to it. The format is a network preset's (presets.go) with the parameter
# provider, the provider's name.
id: iwato-cloudflare
label: Cloudflare
params:
  - { name: provider, label: provider, pattern: "[a-z][a-z0-9-]*" }
network_policies:
  provider_${provider}:
    binaries: ["/**"]
    endpoints:
      - { host: api.cloudflare.com, port: 443, path: /client/v4/graphql, protocol: graphql, access: read-only, enforcement: enforce }
      - { host: api.cloudflare.com, port: 443, path: /client/v4/**, protocol: rest, access: read-only, enforcement: enforce }
